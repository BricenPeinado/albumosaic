[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["cache", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["T201"]
"tests/manual/*.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
